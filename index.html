<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marketing Cartel">
<meta name="theme-color" content="#0D0D0D">
<title>MARKETING CARTEL</title>
<style>
  :root { --gold: #C9A227; --black: #0D0D0D; --card: #1A1A1A; --text: #EDEDED; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; height: 100vh; overflow: hidden; }
  .app { height: 100%; display: flex; flex-direction: column; }
  header { padding: 18px 16px 6px; text-align: center; }
  header h1 { color: var(--gold); font-size: 20px; letter-spacing: 1px; font-weight: 700; }
  header p { color: #aaa; font-size: 12px; margin-top: 2px; }
  .tabs { display: flex; border-bottom: 1px solid #222; }
  .tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12.5px; color: #888; cursor: pointer; }
  .tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); font-weight: 600; }
  .content { flex: 1; overflow-y: auto; padding: 12px 16px 90px; }
  .card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid #222; }
  .card h3 { font-size: 15.5px; margin-bottom: 5px; }
  .meta { color: #bbb; font-size: 13px; margin: 3px 0; line-height: 1.4; }
  .link { color: var(--gold); font-size: 13px; text-decoration: none; }
  .section-note { color: #888; font-size: 12px; margin-bottom: 12px; padding: 0 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MARKETING CARTEL</h1>
    <p>Tyrant CEO · $50k/month · Organic</p>
  </header>
  <div class="tabs">
    <div class="tab active" data-tab="brief">Brief</div>
    <div class="tab" data-tab="ceo">Talk to CEO</div>
    <div class="tab" data-tab="assets">Assets</div>
    <div class="tab" data-tab="plan">Plan</div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const assets = [
  {title:"Website", summary:"marketingcartel.com.au — live, dark/gold brand, websites, apps and growth services. Starter site $499. Contact form and phone 0410 026 429.", link:"https://marketingcartel.com.au"},
  {title:"Instagram", summary:"@marketing_cartel", link:"https://www.instagram.com/marketing_cartel/"},
  {title:"Facebook", summary:"Marketing Cartel page", link:"https://www.facebook.com/share/1F1oNcj6KJ/"},
  {title:"TikTok", summary:"@marketing_cartel", link:"https://www.tiktok.com/@marketing_cartel"},
  {title:"Hard rule", summary:"NEVER use any Aussie Window Tinting clients or lists. Acquisition must be independent."}
];

function render(tab) {
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (tab === 'brief') {
    c.innerHTML = '<p class="section-note">Tyrant CEO daily 7am Perth brief lands here. Goal: $50k/month in 6 months or less with organic free marketing. Nothing launches without your yes.</p><div class="card"><h3>Status</h3><div class="meta">Tyrant CEO is running. First agents created. Plan and 7-day actions incoming. AWT clients are banned.</div></div>';
  } else if (tab === 'ceo') {
    c.innerHTML = '<p class="section-note">Talk directly to the Tyrant CEO. It runs Marketing Cartel. Nothing launches without your yes.</p><div class="card"><h3>Talk to Tyrant CEO</h3><div class="meta">Open the Marketing Cartel Tyrant CEO chat in Grok and message it anytime. It will reply with the plan, actions, and approvals needed.</div><a class="link" href="https://grok.com" target="_blank">Open Grok to talk to CEO →</a></div>';
  } else if (tab === 'assets') {
    c.innerHTML = '<p class="section-note">Existing assets. Tyrant CEO has been instructed to review and use these.</p>';
    assets.forEach(a => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${a.title}</h3><div class="meta">${a.summary}</div>${a.link ? `<a class="link" href="${a.link}" target="_blank">Open →</a>` : ''}`;
      c.appendChild(card);
    });
  } else {
    c.innerHTML = '<p class="section-note">6-month plan to $50k/month. Organic first. Agents building.</p><div class="card"><h3>Target</h3><div class="meta">$50,000/month in 6 months or less. As big and as fast as possible. Organic free marketing. No AWT clients.</div></div>';
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tab);
  };
});
render('brief');
</script>
</body>
</html>
